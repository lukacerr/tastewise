[project]
name = "tastewise-task"
author = "Luka Cerrutti <lukacerrutti2002@gmail.com>"
version = "1.0.0"
description = "Tastewise take-home task"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.2.15",
    "langchain-together>=0.4.0",
    "langgraph>=1.1.10",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "typer>=0.25.0",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.basedpyright]
reportMissingTypeStubs = false
reportUnknownMemberType = false
